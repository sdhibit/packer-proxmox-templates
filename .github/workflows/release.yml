name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the publishing job widens it, and only to what
# `gh release create` needs.
permissions:
  contents: read

# A release is never cancelled half-way: two tags pushed together queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks a pull request gets. A tag that cannot pass them never becomes a
  # release. Inherits this workflow's read-only permissions.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag can be checked against main below.
          fetch-depth: 0
          # `gh` authenticates through GH_TOKEN; git needs no stored credentials.
          persist-credentials: false

      - name: Verify the tag is reachable from main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A tag can be pushed from any commit, including one that was never reviewed
          # or merged. Releases are permanent, so refuse anything not on main.
          # Drop this step if maintenance releases ever need their own branch.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not reachable from main. Refusing to publish."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag carrying a pre-release suffix - v1.2.0-rc.1 - publishes as one.
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac

          # Nothing is compiled here, so the release carries only the source archives
          # GitHub attaches to every release automatically. `--verify-tag` refuses to
          # invent a tag that does not already exist; notes are generated server-side
          # from the commits and pull requests since the previous tag.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
