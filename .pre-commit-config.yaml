repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/cisagov/pre-commit-packer
  rev: v0.3.1
  hooks:
    - id: packer_fmt
      args: ["-write=true"]
    - id: packer_validate
      args: ["-syntax-only"]
      files: \.pkr(?:vars)?\.hcl$
